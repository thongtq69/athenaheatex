<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Us - Shanghai Joylong Industry Co.,Ltd</title>
<script src="/templates/default/js/jquery-1.7.2.min.js" type="text/javascript"></script>
</head>
<body style="margin: 0px; padding: 0px;">
<div class="contTitle">Inquiry</div>
<link href="/aifeedback/form.css" rel="stylesheet" type="text/css"/>
<!--aifeedback start -->
<div class="crm-form">
<div class="create-form-wrap">
<div class="create-form-title" style="background:#5fafdf;">Contact Us</div>
<div class="create-form-inner">
<div class="create-form-ul">
<form action="/api/inquiries" method="post">
<input name="fid" type="hidden" value="1"/>
<input id="pagetitle" name="pagetitle" type="hidden" value="Contact us - Shanghai Joylong Industry Co.,Ltd"/>
<div class="create-form-sort ui-sortable">
<div class="create-form-li">
<div class="create-form-input">
<label>Name<span style="color:#F00">*</span>:</label>
<input name="Name" type="text"/><div class="crmFormVali-error" style="color:#a94442;font-size:12px;line-height:1;margin-top:2px;">This field is required.</div>
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Country:</label>
<input name="Country" type="text"/>
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Company:</label>
<input name="Company" type="text"/>
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Email<span style="color:#F00">*</span>:</label>
<input name="Email" type="text"/>
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Tel:</label>
<input name="Tel" type="text"/>
</div>
</div>
<div class="create-form-block create-form-li create-form-message">
<div class="create-form-textarea">
<label>Message<span style="color:#F00">*</span>:</label>
<textarea name="Message"></textarea>
</div>
</div>
</div>
<div class="create-form-block create-form-cen create-form-action">
<input class="cid" name="cid" type="hidden" value="120"/>
<button class="create-form-submit" style="background:#5fafdf;" type="submit">Submit</button>
</div>
</form>
</div>
</div>
</div>
</div>
<!--aifeedback end -->
<script src="/aifeedback/form.js" type="text/javascript"></script>
<script defer src="/local-runtime.js"></script></body>
</html>
