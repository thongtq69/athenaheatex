<style id="locale-selector-css">.locale-selector{position:relative;display:inline-block;z-index:10000}.locale-trigger{display:flex;align-items:center;gap:7px;border:1px solid #d7e1ec;border-radius:999px;background:#fff;padding:8px 13px;color:#173b68;font-weight:600;cursor:pointer}.locale-menu{position:absolute;right:0;top:calc(100% + 9px);width:265px;background:#fff;border:1px solid #e5ebf2;border-radius:22px;box-shadow:0 16px 40px #173b6826;padding:8px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.18s ease}.locale-selector.open .locale-menu{opacity:1;transform:none;pointer-events:auto}.locale-option{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:15px;padding:11px 12px;text-align:left;color:#173b68;font-size:15px;cursor:pointer}.locale-option:hover,.locale-option[aria-current=true]{background:#f0f5ff}.locale-option .code{margin-left:auto;color:#8090a3;font-size:12px;font-weight:700}.locale-option .check{width:18px;color:#2467b1;font-size:19px}@media(max-width:767px){.locale-menu{right:-8px;width:240px}.locale-trigger{padding:7px 10px}}</style></head>
<body style="margin: 0px; padding: 0px;">
<div class="contTitle">Inquiry</div>
<link href="/aifeedback/form.css" rel="stylesheet" type="text/css"/>
<!--aifeedback start -->
<div class="crm-form">
<div class="create-form-wrap">

<input name="Name" type="text"/><div class="crmFormVali-error" style="color:#a94442;font-size:12px;line-height:1;margin-top:2px;">This field is required.</div>

</div>
</form>
</div>
</div>
</div>
</div>
<!--aifeedback end -->
<script src="/aifeedback/form.js" type="text/javascript"></script>
<script defer="True" src="/local-runtime.js"></script><script id="locale-selector-js">(()=>{const L=[['🇻🇳','Tiếng Việt','VI','vi'],['🇬🇧','English','EN','en'],['🇦🇪','العربية','AR','al'],['🇪🇸','español','ES','es'],['🇫🇷','français','FR','fr'],['🇷🇺','русский','RU','ru'],['🇨🇳','中文','ZH','cn']];let p=location.pathname,m=p.match(/^\/languages\/([^/]+)/),cur=m?m[1]:'en',base=p.replace(/^\/languages\/[^/]+/,'');if(base==='/'||!base)base='/index.html';const wrap=document.createElement('div');wrap.className='locale-selector';const active=L.find(x=>x[3]===cur)||L[1];wrap.innerHTML='<button class="locale-trigger" aria-label="Select language" aria-expanded="false"><span>'+active[0]+'</span><b>'+active[2]+'</b><span aria-hidden="true">⌄</span></button><div class="locale-menu" role="menu">'+L.map(x=>'<button class="locale-option" role="menuitem" aria-current="'+(x[3]===cur)+'" data-locale="'+x[3]+'"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><span class="code">'+x[2]+'</span><span class="check">'+(x[3]===cur?'✓':'')+'</span></button>').join('')+'</div>';let host=document.querySelector('.lang');if(host){host.innerHTML='';host.appendChild(wrap)}else{(document.querySelector('#header')||document.body).appendChild(wrap)}const b=wrap.querySelector('.locale-trigger');b.addEventListener('click',()=>{let o=wrap.classList.toggle('open');b.setAttribute('aria-expanded',o)});wrap.addEventListener('click',async e=>{const o=e.target.closest('.locale-option');if(!o)return;let l=o.dataset.locale,target=l==='en'?base:'/languages/'+l+base;try{let r=await fetch(target,{method:'HEAD'});if(!r.ok)target='/languages/'+l+'/index.html'}catch(_){target='/languages/'+l+'/index.html'}localStorage.setItem('site-locale',l);location.href=target});document.addEventListener('click',e=>{if(!wrap.contains(e.target)){wrap.classList.remove('open');b.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');b.setAttribute('aria-expanded','false')}})})();</script></body>
</html>
