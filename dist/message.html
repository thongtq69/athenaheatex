<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Liên hệ - Shanghai Joylong Industry Co.,Ltd</title>
<script src="/templates/default/js/jquery-1.7.2.min.js" type="text/javascript"></script>
</head>
<body style="margin: 0px; padding: 0px;"><h1 class="cms-visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Liên hệ - Shanghai Joylong Industry Co.,Ltd</h1>
<div class="contTitle">Yêu cầu</div>
<link href="/aifeedback/form.css" rel="stylesheet" type="text/css">
<!--aifeedback start -->
<div class="crm-form">
<div class="create-form-wrap">
<div class="create-form-title" style="background:#5fafdf;">Liên hệ</div>
<div class="create-form-inner">
<div class="create-form-ul">
<form action="/api/inquiries" method="post">
<input name="fid" type="hidden" value="1">
<input id="pagetitle" name="pagetitle" type="hidden" value="Contact us - Shanghai Joylong Industry Co.,Ltd">
<div class="create-form-sort ui-sortable">
<div class="create-form-li">
<div class="create-form-input">
<label>Họ tên<span style="color:#F00">*</span>:</label>
<input name="Name" type="text" aria-label="Họ tên" autocomplete="name">
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Quốc gia:</label>
<input name="Country" type="text" aria-label="Country">
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Công ty:</label>
<input name="Company" type="text" aria-label="Company">
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Email<span style="color:#F00">*</span>:</label>
<input name="Email" type="email" aria-label="E-mail" autocomplete="email">
</div>
</div>
<div class="create-form-li">
<div class="create-form-input">
<label>Điện thoại:</label>
<input name="Tel" type="text" aria-label="Tel">
</div>
</div>
<div class="create-form-block create-form-li create-form-message">
<div class="create-form-textarea">
<label>Tin nhắn<span style="color:#F00">*</span>:</label>
<textarea name="Message" aria-label="Lời nhắn"></textarea>
</div>
</div>
</div>
<div class="create-form-block create-form-cen create-form-action">
<input class="cid" name="cid" type="hidden" value="120">
<button class="create-form-submit" style="background:#5fafdf;" type="submit">Gửi</button>
</div>
</form>
</div>
</div>
</div>
</div>
<!--aifeedback end -->
<script src="/aifeedback/form.js" type="text/javascript"></script>
<script defer="" src="/local-runtime.js"></script>

</body></html>
